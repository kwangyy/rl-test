<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fact verifier</title>
    <script>
        // Set the theme before first paint so the page never flashes the wrong palette.
        (() => {
            try {
                const saved = localStorage.getItem("theme");
                const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.classList.toggle("dark", dark);
            } catch { /* storage blocked: fall back to light */ }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.tsx"></script>
</head>

<body>
    <div id="root"></div>
</body>

</html>
