<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fact verifier</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%233b4a9a%22/%3E%3Cpath d=%22M9 16.5l4.5 4.5L23 11%22 fill=%22none%22 stroke=%22white%22 stroke-width=%223.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" />
    <script>
        // Set the theme before first paint so the page never flashes the wrong palette.
        (() => {
            try {
                const saved = localStorage.getItem("theme");
                const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.classList.toggle("dark", dark);
            } catch { /* storage blocked: fall back to light */ }
        })();
    </script>
    
    
<link rel="stylesheet" crossorigin href="./app.css"><script type="module" crossorigin src="./app.js"></script></head>

<body>
    <div id="root"></div>
</body>

</html>
