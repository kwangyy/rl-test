[project]
name = "rl-test"
version = "0.1.0"
description = "Evidence-grounded FEVER claim verification: verifier SFT/GRPO, retrieval and agent loop"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Lower bounds are the versions the live backend smoke test ran on (2026-10-24, RTX 5070 Ti).
dependencies = [
    "torch>=2.7",
    "transformers>=5.17",
    "accelerate>=1.15",
    "peft>=0.21",
    "trl>=1.13",
    "bitsandbytes>=0.50",
    "datasets>=5.0",
    "numpy>=2.0",
    "gymnasium>=1.0",
    "bm25s>=0.3.11",
    "PyStemmer>=3.1",
    "openai>=3.16",
    "python-dotenv>=1.2",
    "fastapi>=0.161",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
]

[tool.uv]
# Scripts run as `python -m ...` from the repository root; nothing is installed as a package.
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# RTX 50-series (local) and the SoC GPUs both need a CUDA 12.8 torch build.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
